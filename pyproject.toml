[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rag-chunkforge"
version = "0.1.0"
description = "Intelligent, structure-aware document chunking for production RAG pipelines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "RAG ChunkForge contributors" }]
keywords = ["rag", "chunking", "retrieval", "llm", "embeddings", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
tokenizers = ["tiktoken>=0.6"]
embeddings = ["numpy>=1.26"]
all = [
    "pypdf>=4.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "tiktoken>=0.6",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
    "pypdf>=4.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/your-org/rag-chunkforge"
Repository = "https://github.com/your-org/rag-chunkforge"
Issues = "https://github.com/your-org/rag-chunkforge/issues"
Changelog = "https://github.com/your-org/rag-chunkforge/blob/main/CHANGELOG.md"

[project.scripts]
ragforge = "ragforge.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["ragforge"]

[tool.hatch.build.targets.sdist]
include = ["ragforge", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "TID"]
# UP042: `str, Enum` keeps JSON/YAML round-tripping identical across the
# Pydantic and PyYAML versions we support; StrEnum changes repr behaviour.
# SIM905: multi-line `"""...""".split()` word lists are far more readable and
# diff-friendly than the equivalent list literal for vocabulary tables.
ignore = ["B008", "N818", "RUF012", "SIM108", "SIM905", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:ragforge.*"]

[tool.mypy]
python_version = "3.11"
packages = ["ragforge"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["ragforge"]
branch = true
